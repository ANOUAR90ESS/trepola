    <!-- Google tag (gtag.js) queue stub. The real script is loaded after first
         paint (see deferred loader below) so it doesn't compete with the
         critical render path for bandwidth/CPU on mobile; calls made before
         it loads are queued via dataLayer.push and replayed once it arrives. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-V9DNYS0MMG');
    </script>

    <!-- Load gtag.js and adsbygoogle.js after the page finishes loading instead
         of eagerly in <head>, so they don't contend with our own CSS/JS for
         bandwidth during the initial paint on mobile. Staggered with a delay
         between each so their parse/execute bursts don't all land in the same
         task and collide with a real user's first tap (bad INP).

         Subscribe with Google (SwG Basic) was removed: its swg-basic.js script
         injects a full-screen <swg-popup-background> backdrop (dark overlay,
         pointer-events: auto, max z-index) a few seconds after load, on every
         page, for every visitor -- with no accompanying dialog ever rendering.
         The backdrop never dismisses itself, silently blocking every click on
         the entire site. Re-add only once that's fixed/reconfigured on
         Google's side. -->
    <script>
      function loadDeferredThirdPartyScripts() {
        [
          'https://www.googletagmanager.com/gtag/js?id=G-V9DNYS0MMG',
          'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9054863881104831',
        ].forEach(function (src, i) {
          setTimeout(function () {
            var s = document.createElement('script');
            s.src = src;
            s.async = true;
            if (src.indexOf('googlesyndication.com') !== -1) s.crossOrigin = 'anonymous';
            document.head.appendChild(s);
          }, i * 300);
        });
      }
      if (document.readyState === 'complete') {
        loadDeferredThirdPartyScripts();
      } else {
        window.addEventListener('load', loadDeferredThirdPartyScripts);
      }
    </script>
