services:
  db:
    image: postgres:17
    restart: on-failure
    environment:
      POSTGRES_USER: trepola
      POSTGRES_PASSWORD: trepola_local_82f9d4b1
      POSTGRES_DB: trepola
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trepola -d trepola"]
      interval: 5s
      timeout: 3s
      retries: 10

  setup:
    image: node:22-bookworm-slim
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      DATABASE_URL: postgres://trepola:trepola_local_82f9d4b1@db:5432/trepola
    command: ["sh", "-ec", "npm ci --no-audit --no-fund && npx --no-install drizzle-kit push --config=src/db/drizzle.config.ts"]
    depends_on:
      db:
        condition: service_healthy

  web:
    image: node:22-bookworm-slim
    restart: on-failure
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"
    env_file:
      - ./.env.base44-defaults
      - path: /run/base44/app.env
        required: false
    environment:
      NODE_ENV: development
      PORT: "3000"
      CHOKIDAR_USEPOLLING: "true"
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS:
      BASE44_PREVIEW_MODE:
    command: ["sh", "-ec", "exec npx --no-install tsx watch --ignore './src/components/**' --ignore './src/App.tsx' --ignore './src/index.css' server.ts"]
    depends_on:
      setup:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "Promise.all([['frontend','http://127.0.0.1:3000/src/main.tsx'],['backend','http://127.0.0.1:3000/api/articles']].map(async ([name,url]) => { const r = await fetch(url, {signal: AbortSignal.timeout(4000)}); if (!r.ok) throw new Error(name + ' failed: ' + r.status); if (name === 'backend' && !(await r.json()).success) throw new Error('backend response invalid'); })).catch(e => { console.error(e.message); process.exit(1); })"
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3

volumes:
  node_modules:
  postgres_data:
