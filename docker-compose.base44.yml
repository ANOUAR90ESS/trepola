services:
  db:
    image: postgres:17
    restart: on-failure
    environment:
      POSTGRES_USER: trepola
      POSTGRES_PASSWORD: trepola_local_dev
      POSTGRES_DB: trepola
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trepola -d trepola"]
      interval: 5s
      timeout: 3s
      retries: 10
  migrate:
    image: node:22
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      DATABASE_URL: postgres://trepola:trepola_local_dev@db:5432/trepola
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-ec", "npm ci --no-audit --no-fund && npx drizzle-kit push --config=src/db/drizzle.config.ts"]
  web:
    image: node:22
    restart: on-failure
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    env_file:
      - path: /run/base44/app.env
        required: false
    environment:
      NODE_ENV: development
      PORT: "3000"
      DATABASE_URL: postgres://trepola:trepola_local_dev@db:5432/trepola
      BASE44_PREVIEW_MODE:
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS:
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["sh", "-ec", "npm ci --no-audit --no-fund && exec npx tsx watch server.ts"]
    healthcheck:
      test: ["CMD", "node", "-e", "Promise.all(['/api/health', '/src/main.tsx'].map(async p => { const r = await fetch('http://localhost:3000' + p, {signal: AbortSignal.timeout(4000)}); if (!r.ok) throw new Error(p + ': ' + r.status); })).catch(e => { console.error(e.message); process.exit(1); })"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3
volumes:
  postgres_data:
  node_modules:
